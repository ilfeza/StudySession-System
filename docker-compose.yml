services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: study_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d study_platform']
      interval: 5s
      timeout: 5s
      retries: 20

  livekit:
    # Оставляем v1.8 — часто уже в локальном кэше Docker; pull с Hub может падать по TLS/сети.
    # Клиент в VideoSessionPage использует singlePeerConnection: false → сигналинг /rtc (v0), без обязательного /rtc/v1.
    image: livekit/livekit-server:v1.8
    environment:
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-127.0.0.1}
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        sed -e "s/__LIVEKIT_NODE_IP__/$$LIVEKIT_NODE_IP/g" /etc/livekit.yaml > /tmp/livekit.yaml
        exec /livekit-server --config /tmp/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '7880:7880/tcp'
      - '7881:7881/tcp'
      - '50000-50100:50000-50100/udp'

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      SECRET_KEY: super-secret-key
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/study_platform
      UPLOADS_DIR: /app/data/uploads
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devkey_super_secure_32_chars_minimum_2026
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    volumes:
      - uploads_data:/app/data/uploads

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: /api
      VITE_LIVEKIT_URL: auto
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
      - livekit
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  uploads_data:
